# BanglaFinGPT — defaults matching the paper's reported setup.
seed: 42
results_dir: artifacts/results
figures_dir: artifacts/figures

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  segment_min_words: 150      # Sec. 3.2: 150-300 word segments
  segment_max_words: 300
  questions_per_segment: 3    # 2-3 candidate questions per segment
  train_size: 7412            # Table 3
  val_size: 1000
  test_size: 2000
  near_duplicate_threshold: 0.92
  seed: 42

retrieval:
  embedding_model: intfloat/multilingual-e5-base
  index_dir: artifacts/index
  chunk_words: 220
  chunk_overlap_words: 40
  top_k: 5
  hybrid_alpha: 0.7           # 0.7*dense + 0.3*BM25
  normalize_embeddings: true

qlora:
  base_model: BanglaLLM/bangla-llama-3.2-3b-instruct
  load_in_4bit: true
  bnb_4bit_quant_type: nf4    # NormalFloat-4, Eq. (9)
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: auto   # bfloat16 on Ampere+, float16 on Turing (T4)
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05

train:
  output_dir: artifacts/checkpoints/banglafingpt
  max_seq_length: 1024
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  num_train_epochs: 3.0
  max_steps: 30000            # T = 3e4, Sec. 3.3.4
  learning_rate: 0.00005      # alpha_max = 5e-5, Eq. (13)
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  optim: paged_adamw_8bit
  eval_steps: 250
  save_steps: 250
  early_stopping_patience: 3
  gradient_checkpointing: true
  # bf16 unset: resolved from the GPU (T4 -> fp16, RTX 4050 -> bf16)
  seed: 42

generation:
  max_new_tokens: 256
  temperature: 0.2
  top_p: 0.9
  repetition_penalty: 1.05
  do_sample: false

hallucination:
  min_cosine_similarity: 0.70   # Sec. 4.6
  min_keyword_overlap: 0.70
  min_numeric_support: 1.0
  enabled: true

agent:
  backend: local                # local | openai | anthropic | gemini | echo
  model: null
  adapter_path: artifacts/checkpoints/banglafingpt
