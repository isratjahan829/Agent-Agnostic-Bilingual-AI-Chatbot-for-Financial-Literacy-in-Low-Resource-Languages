# Dependency-free smoke configuration: hashing embeddings + the echo agent.
# `make demo` uses this to run the whole pipeline without a GPU or API key.
seed: 42
results_dir: artifacts/demo/results
figures_dir: artifacts/demo/figures

retrieval:
  embedding_model: hashing
  index_dir: artifacts/demo/index
  top_k: 3
  hybrid_alpha: 0.6

hallucination:
  min_cosine_similarity: 0.35
  min_keyword_overlap: 0.50
  min_numeric_support: 1.0
  enabled: true

agent:
  backend: echo
  adapter_path: null
