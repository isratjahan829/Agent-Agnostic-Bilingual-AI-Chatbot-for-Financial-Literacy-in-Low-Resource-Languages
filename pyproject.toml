[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banglafingpt"
version = "0.1.0"
description = "Agent-agnostic bilingual RAG chatbot for financial literacy in Bangla"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.44", "peft>=0.12", "bitsandbytes>=0.43",
         "accelerate>=0.33", "datasets>=2.20", "sentence-transformers>=3.0", "faiss-cpu>=1.8"]
serve = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
banglafingpt = "banglafingpt.app.cli:main"
banglafingpt-train = "banglafingpt.models.train:main"
banglafingpt-eval = "banglafingpt.eval.evaluate:main"
banglafingpt-ablation = "banglafingpt.eval.ablation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI/pydantic defaults are evaluated at import time by design

[tool.ruff.lint.per-file-ignores]
# Scripts prepend src/ to sys.path before importing the package.
"scripts/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
